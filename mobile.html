<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rewriter">
<title>Clipboard Rewriter</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --border: #2a2a2a;
    --text: #e8e8e8;
    --text-dim: #888;
    --accent: #6c63ff;
    --accent-hover: #5a52e0;
    --radius: 12px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    padding: 16px;
    padding-top: env(safe-area-inset-top, 16px);
    padding-bottom: env(safe-area-inset-bottom, 16px);
  }

  h1 {
    font-size: 20px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 16px;
  }

  .modes {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 12px;
    -webkit-overflow-scrolling: touch;
  }

  .modes button {
    flex-shrink: 0;
    padding: 8px 16px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--surface);
    color: var(--text-dim);
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .modes button.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    font-size: 16px;
    padding: 14px;
    resize: none;
    font-family: inherit;
    line-height: 1.5;
    outline: none;
    transition: border-color 0.2s;
  }

  textarea:focus { border-color: var(--accent); }

  #input {
    height: 150px;
    margin-bottom: 12px;
  }

  #output {
    height: 180px;
    margin-bottom: 12px;
  }

  .btn-row {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }

  .btn-primary {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: var(--radius);
    background: var(--accent);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }

  .btn-primary:active { background: var(--accent-hover); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-secondary {
    padding: 14px 20px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
  }

  .btn-secondary:active { background: var(--border); }

  .status {
    text-align: center;
    font-size: 13px;
    color: var(--text-dim);
    min-height: 20px;
    margin-bottom: 12px;
  }

  .status.error { color: #ff5555; }
  .status.success { color: #50fa7b; }

  .settings-toggle {
    text-align: center;
    margin-bottom: 12px;
  }

  .settings-toggle button {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
  }

  .settings {
    display: none;
    margin-bottom: 16px;
  }

  .settings.open { display: block; }

  .settings label {
    display: block;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }

  .settings input, .settings select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    margin-bottom: 12px;
    outline: none;
  }

  .settings input:focus, .settings select:focus { border-color: var(--accent); }

  .char-count {
    text-align: right;
    font-size: 12px;
    color: var(--text-dim);
    margin-top: -8px;
    margin-bottom: 8px;
  }

  .swap-btn {
    display: flex;
    justify-content: center;
    margin-bottom: 8px;
  }

  .swap-btn button {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 36px;
    height: 36px;
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body>

<h1>Clipboard Rewriter</h1>

<div class="modes" id="modes">
  <button class="active" data-mode="default">Default</button>
  <button data-mode="professional">Professional</button>
  <button data-mode="casual">Casual</button>
  <button data-mode="fix">Fix Grammar</button>
  <button data-mode="prompt">AI Prompt</button>
</div>

<textarea id="input" placeholder="Paste or type your text here..."></textarea>
<div class="char-count"><span id="charCount">0</span> chars</div>

<div class="btn-row">
  <button class="btn-primary" id="rewriteBtn" onclick="rewrite()">Rewrite</button>
  <button class="btn-secondary" id="pasteBtn" onclick="pasteFromClipboard()">Paste</button>
</div>

<div class="status" id="status"></div>

<div class="swap-btn">
  <button onclick="swapText()" title="Use output as input">&#8595;</button>
</div>

<textarea id="output" placeholder="Rewritten text will appear here..." readonly></textarea>

<div class="btn-row">
  <button class="btn-secondary" style="flex:1" onclick="copyOutput()">Copy Result</button>
  <button class="btn-secondary" onclick="clearAll()">Clear</button>
</div>

<div class="settings-toggle">
  <button onclick="toggleSettings()">Settings</button>
</div>

<div class="settings" id="settings">
  <label for="apiKey">OpenAI API Key</label>
  <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off">

  <label for="model">Model</label>
  <select id="model">
    <option value="gpt-4o-mini">gpt-4o-mini (fast, cheap)</option>
    <option value="gpt-4o">gpt-4o (best quality)</option>
    <option value="gpt-4.1-mini">gpt-4.1-mini</option>
    <option value="gpt-4.1-nano">gpt-4.1-nano (fastest)</option>
  </select>

  <label for="temperature">Temperature: <span id="tempValue">0.7</span></label>
  <input type="range" id="temperature" min="0" max="1" step="0.1" value="0.7"
         oninput="document.getElementById('tempValue').textContent = this.value">

  <button class="btn-secondary" style="width:100%" onclick="saveSettings()">Save Settings</button>
</div>

<script>
const PROMPTS = {
  default: "You are a writing assistant. Rewrite the following text to be clearer and more polished while preserving the original meaning, tone, and FORMAT. Keep it as regular text \u2014 do NOT convert it into an email, letter, or any other format. Do NOT add greetings, sign-offs, subject lines, or signatures. Do NOT add any preamble, explanation, or commentary \u2014 return ONLY the rewritten text.",
  professional: "You are a writing assistant. Rewrite the following text in a professional, polished tone while keeping the SAME format. If the input is a short message or note, keep it as a short message or note. Do NOT convert it into an email, letter, or formal document. Do NOT add greetings, sign-offs, subject lines, or signatures. Just improve the wording to sound more professional. Do NOT add any preamble, explanation, or commentary \u2014 return ONLY the rewritten text.",
  casual: "You are a writing assistant. Rewrite the following text in a casual, friendly tone while keeping the SAME format. If the input is a short message, keep it short. Do NOT convert it into an email or letter. Do NOT add greetings, sign-offs, or signatures. Just make it sound more natural and conversational. Do NOT add any preamble, explanation, or commentary \u2014 return ONLY the rewritten text.",
  fix: "You are a grammar and spelling expert. Fix any grammar, spelling, or punctuation errors in the following text. Do NOT change the meaning, tone, style, or format \u2014 only correct errors. Do NOT add any preamble, explanation, or commentary \u2014 return ONLY the corrected text.",
  prompt: "You are an elite AI prompt engineer. Take the following rough idea or text and rewrite it as a clear, well-structured, and highly effective prompt. Apply prompt engineering best practices: be specific, provide context, define the desired output format, set constraints, and use role-based framing where appropriate. Make the prompt detailed enough to get excellent results from an AI model. Do NOT add any preamble, explanation, or commentary \u2014 return ONLY the rewritten prompt."
};

let currentMode = "default";

// --- Mode selection ---
document.getElementById("modes").addEventListener("click", (e) => {
  if (e.target.tagName !== "BUTTON") return;
  document.querySelectorAll(".modes button").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  currentMode = e.target.dataset.mode;
});

// --- Char count ---
document.getElementById("input").addEventListener("input", () => {
  document.getElementById("charCount").textContent = document.getElementById("input").value.length;
});

// --- Status helpers ---
function setStatus(msg, type = "") {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = "status " + type;
}

// --- Settings ---
function loadSettings() {
  const key = localStorage.getItem("cw_apiKey") || "";
  const model = localStorage.getItem("cw_model") || "gpt-4o-mini";
  const temp = localStorage.getItem("cw_temperature") || "0.7";
  document.getElementById("apiKey").value = key;
  document.getElementById("model").value = model;
  document.getElementById("temperature").value = temp;
  document.getElementById("tempValue").textContent = temp;
}

function saveSettings() {
  localStorage.setItem("cw_apiKey", document.getElementById("apiKey").value.trim());
  localStorage.setItem("cw_model", document.getElementById("model").value);
  localStorage.setItem("cw_temperature", document.getElementById("temperature").value);
  setStatus("Settings saved", "success");
}

function toggleSettings() {
  document.getElementById("settings").classList.toggle("open");
}

function getApiKey() {
  return document.getElementById("apiKey").value.trim() || localStorage.getItem("cw_apiKey") || "";
}

// --- Clipboard ---
async function pasteFromClipboard() {
  try {
    const text = await navigator.clipboard.readText();
    document.getElementById("input").value = text;
    document.getElementById("charCount").textContent = text.length;
    setStatus("Pasted from clipboard", "success");
  } catch {
    setStatus("Clipboard access denied \u2014 paste manually", "error");
  }
}

async function copyOutput() {
  const text = document.getElementById("output").value;
  if (!text) { setStatus("Nothing to copy", "error"); return; }
  try {
    await navigator.clipboard.writeText(text);
    setStatus("Copied to clipboard!", "success");
  } catch {
    document.getElementById("output").select();
    document.execCommand("copy");
    setStatus("Copied! (fallback)", "success");
  }
}

// --- Swap & Clear ---
function swapText() {
  const output = document.getElementById("output").value;
  if (!output) return;
  document.getElementById("input").value = output;
  document.getElementById("output").value = "";
  document.getElementById("charCount").textContent = output.length;
  setStatus("Output moved to input", "");
}

function clearAll() {
  document.getElementById("input").value = "";
  document.getElementById("output").value = "";
  document.getElementById("charCount").textContent = "0";
  setStatus("");
}

// --- Rewrite via OpenAI API ---
async function rewrite() {
  const input = document.getElementById("input").value.trim();
  if (!input) { setStatus("Type or paste some text first", "error"); return; }

  const apiKey = getApiKey();
  if (!apiKey) {
    setStatus("Set your OpenAI API key in Settings below", "error");
    document.getElementById("settings").classList.add("open");
    document.getElementById("apiKey").focus();
    return;
  }

  const model = document.getElementById("model").value;
  const temperature = parseFloat(document.getElementById("temperature").value);
  const systemPrompt = PROMPTS[currentMode];

  const btn = document.getElementById("rewriteBtn");
  btn.disabled = true;
  btn.textContent = "Rewriting...";
  setStatus("Calling OpenAI API...", "");
  document.getElementById("output").value = "";

  try {
    const res = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + apiKey
      },
      body: JSON.stringify({
        model: model,
        temperature: temperature,
        messages: [
          { role: "system", content: systemPrompt },
          { role: "user", content: input }
        ]
      })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || "API error " + res.status);
    }

    const data = await res.json();
    const result = data.choices[0].message.content.trim();
    document.getElementById("output").value = result;
    setStatus("Done! " + result.length + " chars", "success");
  } catch (e) {
    setStatus("Error: " + e.message, "error");
  } finally {
    btn.disabled = false;
    btn.textContent = "Rewrite";
  }
}

// --- Init ---
loadSettings();
</script>
</body>
</html>
